# cargo-audit configuration.
#
# cargo-audit scans Cargo.lock, which is feature-independent: it lists every
# optional dependency of every crate in the graph even when the corresponding
# feature is never enabled. Advisories on such never-compiled crates can be
# ignored here with a justification; do not add ignores for crates that are
# actually built.
#
# No active ignores. The historical RUSTSEC-2023-0071 (rsa, Marvin Attack)
# ignore became unnecessary with sqlx 0.9: `rsa` is an optional dependency
# of `sqlx-mysql 0.9`, guarded by its `rsa` feature (spelled `mysql-rsa` on
# the sqlx meta-crate), and the workspace builds sqlx with only the
# `runtime-tokio`, `sqlite` and `migrate` features (Cargo.toml), so `rsa`
# never reaches Cargo.lock. Should it ever re-enter the lock, re-add a
# targeted `ignore = ["RUSTSEC-2023-0071"]` justified by "optional, never
# compiled".

[advisories]
ignore = []

# A warning-class advisory must fail the audit: cargo-audit only warns by
# default, and a warning nothing fails on is a warning ignored.
[output]
deny = ["warnings"]
quiet = false
