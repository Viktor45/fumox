name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# One run per ref: a new push supersedes the previous run on the same
# branch, so a superseded commit does not keep a runner busy. A pull
# request has its own ref (refs/pull/<n>/merge), so two PRs never cancel
# each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The YAML that drives the pipeline must parse: a workflow file, the
      # Dependabot config or an issue-template frontmatter with a syntax
      # error should fail here, on the author's PR, rather than half-apply
      # on GitHub's side. The tools run out of a throwaway venv so the
      # externally-managed system Python never gets touched.
      - name: Validate YAML configs
        run: |
          python3 -m venv /tmp/yaml-venv
          /tmp/yaml-venv/bin/pip install --quiet yamllint check-jsonschema
          /tmp/yaml-venv/bin/yamllint -d relaxed .github/workflows .github/dependabot.yml .github/ISSUE_TEMPLATE/config.yml
          /tmp/yaml-venv/bin/check-jsonschema --schemafile https://json.schemastore.org/dependabot-2.0.json .github/dependabot.yml
          # The issue templates' frontmatter is YAML too: extract what
          # sits between the --- fences and lint it the same way.
          fm="$(mktemp -d)"
          for md in .github/ISSUE_TEMPLATE/*.md; do
            awk 'NR==1 && $0=="---" {next} $0=="---" {exit} {print}' "$md" >"$fm/$(basename "$md").yaml"
          done
          /tmp/yaml-venv/bin/yamllint -d relaxed "$fm"/*.yaml
          rm -rf "$fm"

      # sqlx links the system SQLite (not bundled), so headers are required.
      - name: Install SQLite dev package
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # The compile/test invocations below are --locked, matching the
      # `--locked` in Dockerfile: without it a drifted Cargo.lock is silently
      # rewritten here while CI stays green, and the released image then
      # builds from a different resolution than the one that was tested.
      # (`cargo fmt` takes no such flag.)
      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      # Ops-script coverage: `cargo test` never executes scripts/, and these
      # carry real write paths (revive, adopt, restore), the compose
      # teardown the smoke stand depends on, and the GHCR retention
      # rules. All are hermetic — they need only bash and the sqlite3 CLI,
      # both present on the runner image — and none touches the network or
      # a real container engine.
      - name: Script tests
        run: |
          bash scripts/tests/cleanup-ghcr.test.sh
          bash scripts/tests/published-ports.test.sh
          bash scripts/tests/repair-geo-stamps.test.sh
          bash scripts/tests/revive-xhttp-proxies.test.sh
          bash scripts/tests/smoke-down.test.sh
          bash scripts/tests/smoke-up.test.sh
          bash scripts/tests/validate-meow-version.test.sh

      # The changelog generator runs on a draft git-cliff produces; it
      # must not drop a category or crash on a malformed line.
      - name: Changelog generator test
        run: python3 scripts/tests/make-changelog.test.py

      # The commit_parsers of cliff.toml decide the draft's categories; the
      # fixture replays a feat/fix/docs/chore/build/Bump/merge subject set
      # against them. git-cliff ships a prebuilt wheel, so it installs out
      # of the same kind of throwaway venv the YAML tools above run from.
      - name: git-cliff configuration test
        run: |
          python3 -m venv /tmp/cliff-venv
          /tmp/cliff-venv/bin/pip install --quiet git-cliff
          PATH="/tmp/cliff-venv/bin:$PATH" bash scripts/tests/cliff-config.test.sh

  # Smoke test of the nginx TLS-front image (docker/nginx/): the image is
  # built with the default compose flavour and run with self-signed
  # certificates mounted at /certs. scripts/nginx-smoke.sh then proves
  # nginx -t passes, /.well-known/acme-challenge/ is not redirected to
  # HTTPS while other HTTP requests are (301), a TLS handshake succeeds,
  # the access log masks the /export tokens, and a SIGHUP reload serves a
  # replaced certificate. Needs a container engine, hence its own job
  # (the Script tests above are deliberately hermetic).
  nginx-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the nginx image
        run: docker build -t localhost/fumox-nginx:local docker/nginx

      - name: Nginx image smoke test
        run: bash scripts/nginx-smoke.sh localhost/fumox-nginx:local
