name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_image_builds:
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned CI tools
        run: |
          python3 -m venv /tmp/ci-venv
          /tmp/ci-venv/bin/pip install --quiet -r .github/requirements.txt
          echo /tmp/ci-venv/bin >> "$GITHUB_PATH"

      - name: Validate workflow and dependency configuration
        run: |
          yamllint -d relaxed .github/workflows .github/dependabot.yml .github/ISSUE_TEMPLATE/config.yml
          check-jsonschema --schemafile https://json.schemastore.org/dependabot-2.0.json .github/dependabot.yml
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= .github/workflows/*.yml
          fm="$(mktemp -d)"
          for md in .github/ISSUE_TEMPLATE/*.md; do
            awk 'NR==1 && $0=="---" {next} $0=="---" {exit} {print}' "$md" >"$fm/$(basename "$md").yaml"
          done
          yamllint -d relaxed "$fm"/*.yaml
          rm -rf "$fm"

      - name: Install SQLite dev package
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev sqlite3

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
  # disabled
  #      - name: Script tests
  #        run: |
  #          for test in scripts/tests/*.test.sh; do bash "$test"; done
  #          for test in scripts/tests/*.test.py; do python3 "$test"; done

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read minimum Rust version
        id: rust
        run: |
          python3 -c 'import tomllib; print("version=" + tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])' >> "$GITHUB_OUTPUT"
      - name: Install SQLite dev package
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: msrv
      - run: cargo check --locked --workspace --all-targets

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: cargo-audit
      - name: Audit dependencies
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit

  images:
    if: ${{ !inputs.skip_image_builds }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: fumox
            context: .
          - name: nginx
            context: ./docker/nginx
          - name: meow
            context: ./docker/meow
        target:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      # Build-only coverage; no container starts or listening ports.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.image.context }}
          platforms: ${{ matrix.target.platform }}
          push: false
          cache-from: type=gha,scope=ci-${{ matrix.image.name }}-${{ matrix.target.runner }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.image.name }}-${{ matrix.target.runner }}

  gate:
    name: CI gate
    if: always()
    needs: [check, msrv, audit, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all quality checks
        env:
          CHECK: ${{ needs.check.result }}
          MSRV: ${{ needs.msrv.result }}
          AUDIT: ${{ needs.audit.result }}
          IMAGES: ${{ needs.images.result }}
          SKIP_IMAGES: ${{ inputs.skip_image_builds }}
        run: |
          test "$CHECK" = success
          test "$MSRV" = success
          test "$AUDIT" = success
          if [ "$SKIP_IMAGES" = true ]; then
            test "$IMAGES" = skipped
          else
            test "$IMAGES" = success
          fi
