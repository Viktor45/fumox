name: CI

on:
  workflow_dispatch:
#  push:
#    branches: [main]
#  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # sqlx links the system SQLite (not bundled), so headers are required.
      - name: Install SQLite dev package
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2

      # The compile/test invocations below are --locked, matching the
      # `--locked` in Dockerfile: without it a drifted Cargo.lock is silently
      # rewritten here while CI stays green, and the released image then
      # builds from a different resolution than the one that was tested.
      # (`cargo fmt` takes no such flag.)
      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      # Ops-script coverage: `cargo test` never executes scripts/, and this
      # one carries real write paths (revive, adopt, restore). Needs only
      # bash and sqlite3, both present on the runner image.
      #- name: Script tests
      #  run: bash scripts/tests/revive-xhttp-proxies.test.sh
