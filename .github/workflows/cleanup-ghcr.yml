# Manifest-aware GHCR retention for the Fumox container image.
#
# The build workflow pushes per-arch images by digest and then runs a merge
# job that stitches them into one multi-arch manifest list tagged with
# `latest`, semver (`0.2.0`, `0.2`) and `main`. Per-arch images also get
# transient `sha-<shortsha>` tags for trace.
#
# A naive "delete anything not `latest`" cleanup breaks the merged manifest
# list — the per-arch digests it references would disappear before the
# manifest itself. So this workflow deletes ONLY:
#   - versions with an empty/null tag list (buildx "unknown/unknown"
#     artifacts from docker/build-push-action#820/#900), regardless of age;
#   - intermediate per-arch digest tags matching `sha-*`, older than
#     RETENTION_DAYS (default 30).
# All other tags (`latest`, `main`, `0.x.y`) are kept. Run manually.

name: Cleanup Non-Latest GHCR Images

on:
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Delete `sha-*` tags older than this many days (1-365)"
        required: true
        default: "30"
        type: string
      dry_run:
        description: "If true, list what would be deleted but do not delete"
        required: false
        default: "true"
        type: boolean

permissions:
  packages: write

jobs:
  prune-sha-tags:
    runs-on: ubuntu-latest
    env:
      OWNER: Viktor45
      PACKAGES: fumox,fumox-meow
    steps:
      - name: Delete old `sha-*` tags, preserve `latest`/`main`/semver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETENTION_DAYS: ${{ github.event.inputs.retention_days }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          if ! [[ "$RETENTION_DAYS" =~ ^[0-9]+$ ]] || [ "$RETENTION_DAYS" -lt 1 ] || [ "$RETENTION_DAYS" -gt 365 ]; then
            echo "::error::retention_days must be an integer in [1, 365], got: $RETENTION_DAYS" >&2
            exit 1
          fi

          cutoff=$(date -u -d "-${RETENTION_DAYS} days" +%s)
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY-RUN: listing sha-* versions older than $RETENTION_DAYS days (no delete)"
          else
            echo "Deleting sha-* versions older than $RETENTION_DAYS days"
          fi

          err_tmp="$(mktemp)"
          cleanup() { rm -f "$err_tmp"; }
          trap cleanup EXIT

          for pkg in ${PACKAGES//,/ }; do
            echo
            echo "=== $OWNER/$pkg ==="

            # Walk the container versions. Each call returns up to 100 entries
            # (paged); we filter client-side by tag prefix and created_at so
            # we never have to round-trip ref data.
            page=1
            while :; do
              # Capture body on stdout, stderr to a temp file. A non-zero exit
              # + 404 means the package itself is missing on page=1 (skip this
              # package and move on) or end-of-list on a later page (break the
              # walk). Other failures still bail out under set -e.
              resp=$(gh api \
                -H "Accept: application/vnd.github+json" \
                "/orgs/${OWNER}/packages/container/${pkg}/versions?per_page=100&page=${page}" \
                2>"$err_tmp")
              gh_status=$?
              gh_err="$(cat "$err_tmp" 2>/dev/null || true)"
              if [ "$gh_status" -ne 0 ] || [ -z "$resp" ]; then
                case "$gh_err" in
                  *"404"*)
                    if [ "$page" -eq 1 ]; then
                      echo "  skip: $pkg not found on $OWNER"
                      echo "         (does it exist? token can read it?"
                      echo "          no action this run.)"
                      rm -f "$err_tmp"
                      break 2   # exit both `while` and `for pkg`
                    else
                      echo "  page $page returned 404 — assuming end-of-list"
                      break
                    fi
                    ;;
                  *"403"*)
                    if [ "$page" -eq 1 ]; then
                      echo "  skip: $pkg private/no read access (403)"
                      echo "         (use a PAT with packages:read.)"
                      rm -f "$err_tmp"
                      break 2
                    fi
                    ;;
                  *)
                    printf '%s\n' "$gh_err" | sed 's/^/  gh: /' >&2
                    echo "  error: gh api exited with status $gh_status; aborting this package" >&2
                    rm -f "$err_tmp"
                    break 2
                    ;;
                esac
              fi
              count=$(printf '%s' "$resp" | jq 'length')
              if [ "$count" = "0" ] || [ -z "$count" ]; then
                break
              fi

              # IDs whose tag list contains a `sha-*` value (and ONLY sha-*
              # tags — if it also has `latest`/`main`/semver, it's referenced
              # by a manifest list and must be kept) AND whose created_at is
              # older than the cutoff.
              deleted_for_pkg=0
              while IFS=read -r id; do
                if [ -z "$id" ] || [ "$id" = "null" ]; then continue; fi

                tags=$(printf '%s' "$resp" | jq -r --argjson id "$id" \
                  '.[] | select(.id == $id) | .metadata.container.tags // [] | .[]')

                # A version whose tag list is empty (or contains only
                # null/empty entries) is the buildx "unknown/unknown" artifact
                # documented in docker/build-push-action#820 (closed) and #900
                # (open): the manifest-list entry the registry can't map to a
                # recognised os/architecture pair. It carries no human-readable
                # name and cannot be referenced by any external tag, so it is
                # ALWAYS safe to delete regardless of age.
                untagged=true
                while IFS= read -r tag; do
                  case "$tag" in
                    ""|null) ;;
                    *) untagged=false ;;
                  esac
                done <<< "$tags"

                if [ "$untagged" = "false" ]; then
                  # Has at least one real tag. Keep if any non-sha-* tag is
                  # present (externally consumed via latest/main/semver).
                  keep=false
                  while IFS= read -r tag; do
                    case "$tag" in
                      ""|null) ;;
                      sha-*) ;;
                      *) keep=true ;;
                    esac
                  done <<< "$tags"
                  if [ "$keep" = "true" ]; then continue; fi

                  created_at=$(printf '%s' "$resp" | jq -r --argjson id "$id" \
                    '.[] | select(.id == $id) | .created_at')
                  # RFC-3339 timestamp -> epoch seconds.
                  created_epoch=$(date -u -d "$created_at" +%s 2>/dev/null || echo 0)
                  if [ "$created_epoch" -ge "$cutoff" ]; then continue; fi
                  reason="sha-*-only, created_at=$created_at"
                else
                  reason='untagged (unknown/unknown artifact)'
                fi

                if [ "$DRY_RUN" = "true" ]; then
                  echo "  [dry-run] would delete id=$id — $reason"
                else
                  echo "  deleting id=$id — $reason"
                  # Idempotency: a 404 here means another job deleted this
                  # version between our listing and our DELETE. Drop it from
                  # the count without failing the run.
                  gh api -X DELETE \
                    -H "Accept: application/vnd.github+json" \
                    "/orgs/${OWNER}/packages/container/${pkg}/versions/${id}" \
                    2>"$err_tmp"
                  del_status=$?
                  if [ "$del_status" -ne 0 ] && grep -q "404" "$err_tmp"; then
                    echo "  (already gone — race with another job)"
                    deleted_for_pkg=$((deleted_for_pkg + 1))
                    continue
                  elif [ "$del_status" -ne 0 ]; then
                    printf '%s\n' "$(cat "$err_tmp")" | sed 's/^/  gh: /' >&2
                    echo "  error: gh api DELETE exited with status $del_status; aborting this package" >&2
                    rm -f "$err_tmp"
                    break 2
                  fi
                fi
                deleted_for_pkg=$((deleted_for_pkg + 1))
              done < <(printf '%s' "$resp" | jq -r '.[].id')

              page=$((page + 1))
            done

            echo "  $pkg: $deleted_for_pkg version(s) ${DRY_RUN:+would be }deleted"
          done

          echo
          echo "Done."
