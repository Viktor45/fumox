name: Docker meow

on:
  workflow_dispatch:
    inputs:
      meow_version:
        description: "meow-rs release to package (a tag like v0.27.0)"
        required: true
        type: string
      meow_sha256_amd64:
        description: "sha256 of meow-<version>-x86_64-unknown-linux-musl.tar.gz"
        required: true
        type: string
      meow_sha256_arm64:
        description: "sha256 of meow-<version>-aarch64-unknown-linux-musl.tar.gz"
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

concurrency:
  group: ghcr-images
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    with:
      skip_image_builds: true

  build:
    needs: quality
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare
        id: image
        env:
          REPO: ${{ github.repository }}
          PLATFORM: ${{ matrix.platform }}
          MEOW_INPUT: ${{ inputs.meow_version }}
          MEOW_SHA256_AMD64_INPUT: ${{ inputs.meow_sha256_amd64 }}
          MEOW_SHA256_ARM64_INPUT: ${{ inputs.meow_sha256_arm64 }}
        run: |
          echo "name=${REGISTRY}/${REPO,,}-meow" >> "$GITHUB_OUTPUT"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
          MEOW_VERSION="$(scripts/validate-meow-version.sh "$MEOW_INPUT")"
          echo "MEOW_VERSION=${MEOW_VERSION}" >> "$GITHUB_ENV"
          for pair in "AMD64:${MEOW_SHA256_AMD64_INPUT}" "ARM64:${MEOW_SHA256_ARM64_INPUT}"; do
            arch="${pair%%:*}"
            sum="${pair#*:}"
            sum="$(printf '%s' "$sum" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
            [[ "$sum" =~ ^[0-9a-f]{64}$ ]] || { echo '::error::expected a 64-character hex sha256' >&2; exit 1; }
            echo "MEOW_SHA256_${arch}=${sum}" >> "$GITHUB_ENV"
          done

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: type=raw,value=${{ env.MEOW_VERSION }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./docker/meow
          platforms: ${{ matrix.platform }}
          build-args: |
            MEOW_VERSION=${{ env.MEOW_VERSION }}
            MEOW_SHA256_AMD64=${{ env.MEOW_SHA256_AMD64 }}
            MEOW_SHA256_ARM64=${{ env.MEOW_SHA256_ARM64 }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=fumox-meow-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=fumox-meow-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      # The controller smoke stand remains disabled because it listens on a port.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [quality, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Prepare
        id: image
        env:
          REPO: ${{ github.repository }}
          MEOW_INPUT: ${{ inputs.meow_version }}
        run: |
          echo "name=${REGISTRY}/${REPO,,}-meow" >> "$GITHUB_OUTPUT"
          MEOW_VERSION="$(scripts/validate-meow-version.sh "$MEOW_INPUT")"
          echo "MEOW_VERSION=${MEOW_VERSION}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,prefix=branch-,enable=${{ github.ref != 'refs/heads/main' }}
            type=sha
            type=raw,value=${{ env.MEOW_VERSION }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create candidate index
        id: manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: bash scripts/image-release.sh candidate

      - name: Attest the candidate index
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Verify candidate index and provenance
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          INDEX_DIGEST: ${{ steps.manifest.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/image-release.sh verify

      - name: Promote verified index
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          INDEX_DIGEST: ${{ steps.manifest.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: bash scripts/image-release.sh promote
