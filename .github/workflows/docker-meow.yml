# Builds the fumox-meow image (docker/meow/Dockerfile — a thin wrapper around
# a meow-rs release binary) for linux/amd64 and linux/arm64 and pushes a
# combined multi-arch manifest to GHCR (ghcr.io/viktor45/fumox-meow).
#
# MANUAL ONLY: this workflow never runs on push or tags — dispatch it from
# the Actions tab (or `gh workflow run docker-meow.yml [-f meow_version=v0.21.2]`).
#
# The MEOW_VERSION input picks the packaged meow-rs release, exactly like the
# MEOW_VERSION build arg of docker/meow/Dockerfile (and .env for local
# builds): `latest` (default) resolves the newest upstream release at build
# time through the GitHub API; a tag (e.g. v0.21.2) pins one. The input value
# (whitespace-trimmed) is also applied as an image tag, so a pinned build is
# addressable as ghcr.io/viktor45/fumox-meow:v0.21.2.
#
# Strategy: same as docker.yml — each architecture is built NATIVELY on a
# matching GitHub runner (the fetch stage runs apt-get, which is painfully
# slow under QEMU), pushed by digest, and attested per platform with
# actions/attest-build-provenance; a merge job stitches the already-attested
# digests into one manifest list.
#
# Resulting tags:
#   MEOW_VERSION=latest  -> latest, main, sha-<shortsha>
#   MEOW_VERSION=v0.21.2 -> v0.21.2, main, sha-<shortsha>
#
# The compose/quadlet stacks use the locally built `fumox-meow:local`; this
# GHCR image exists for deployments that prefer to pull — point the compose
# service's `image:` at it and drop its `build:` section.

name: Docker meow

on:
  workflow_dispatch:
    inputs:
      meow_version:
        description: "meow-rs release to package (tag like v0.21.2, or latest)"
        required: false
        default: "latest"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    permissions:
      contents: read
      packages: write
      # Required by actions/attest-build-provenance (OIDC token + writing
      # the attestation to the registry).
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare
        env:
          MEOW_INPUT: ${{ inputs.meow_version }}
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          echo "MEOW_VERSION=${MEOW_INPUT//[[:space:]]/}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name
        id: image
        run: |
          echo "name=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-meow" \
            >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=${{ env.MEOW_VERSION }}

      # Push the single-platform image by digest only; tags are attached by
      # the merge job once both architectures exist.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./docker/meow
          platforms: ${{ matrix.platform }}
          build-args: |
            MEOW_VERSION=${{ env.MEOW_VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=fumox-meow-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=fumox-meow-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      # Attest this single-platform image by digest; the merge job only
      # stitches already-attested digests into the manifest list.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      # GITHUB_ENV does not cross jobs — re-derive the trimmed input for the
      # tag list (must match the build job's tags exactly).
      - name: Prepare
        env:
          MEOW_INPUT: ${{ inputs.meow_version }}
        run: |
          echo "MEOW_VERSION=${MEOW_INPUT//[[:space:]]/}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: |
          echo "name=${{ env.REGISTRY }}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-meow" \
            >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=${{ env.MEOW_VERSION }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.image.outputs.name }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            "${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}"
