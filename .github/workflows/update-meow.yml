name: Update meow-rs pin

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      meow_version:
        description: "meow-rs tag to pin, e.g. v0.29.0 (default: the newest release)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: update-meow-pin
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Update the pin
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          MEOW_INPUT: ${{ inputs.meow_version }}
        run: |
          args=()
          if [ -n "$MEOW_INPUT" ]; then
            args+=(--version "$MEOW_INPUT")
          fi
          scripts/update-meow-pin.sh "${args[@]}"

      - name: Reconcile the pull request
        if: steps.pin.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pin.outputs.version }}
          PREVIOUS: ${{ steps.pin.outputs.previous_version }}
          SHA256_AMD64: ${{ steps.pin.outputs.sha256_amd64 }}
          SHA256_ARM64: ${{ steps.pin.outputs.sha256_arm64 }}
          BASE: ${{ github.event.repository.default_branch }}
        run: bash scripts/open-meow-pr.sh
