[workspace]
resolver = "2"
members = ["crates/fumox-core", "crates/fumox-server", "crates/fumox-probe"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
# Internal crates
fumox-core = { path = "crates/fumox-core" }

# Async runtime / HTTP
tokio = { version = "1", features = ["full"] }
axum = "0.8"
# `ServiceExt::oneshot` drives the router in the fumox-server tests;
# `BodyExt::collect` reads response bodies there.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# reqwest 0.13: rustls is the default TLS backend and `rustls-tls` became
# `rustls`. The `rustls-no-provider` feature is the one that leaves the
# crypto provider unset, so the process installs `ring` explicitly
# (fumox_core::tls::install_crypto_provider) instead of carrying two
# providers. Enabling `rustls` here would pull in aws-lc-rs as well.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "gzip",
    "brotli",
    "json",
    # RequestBuilder::query() is a feature since reqwest 0.13 (meow T2 calls).
    "query",
] }
# T1 TLS handshakes in the probe daemon (health checks, not a trust boundary).
# default-features = false keeps tokio-rustls from re-enabling the aws-lc-rs
# provider on the rustls crate.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }
# The one crypto provider in the process.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }

# Serialization / config
serde = { version = "1", features = ["derive"] }
# preserve_order keeps JSON object key order (vmess round-trip fidelity).
serde_json = { version = "1", features = ["preserve_order"] }
# YAML (Clash input/output). serde_yaml is deprecated, serde_yml turned out
# unsound+unmaintained (RUSTSEC-2025-0068); serde_norway is the maintained
# fork recommended by RustSec, API-compatible with serde_yaml 0.9.
serde_norway = "0.9"
figment = { version = "0.10", features = ["toml", "env"] }
toml = "1"
# Round-trip TOML editing: keeps every existing comment in config/app.toml
# when the admin panel writes a single field back. Used only by
# fumox-core::config_writer (admin editor path).
toml_edit = { version = "0.25", features = ["display"] }

# Database
# sqlx 0.9: query*() takes `impl SqlSafeStr`, `&'static str` directly,
# dynamic SQL wrapped in `sqlx::AssertSqlSafe`.
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
# The SQLite C API, for the authorizer that restricts the probe's
# database connection. The version has to match the one sqlx-sqlite
# resolves to: the authorizer is installed on the very handle sqlx
# hands out, so both crates must link the same library. sqlx-sqlite
# allows `>=0.30.1, <0.38.0`; 0.37 is what the lockfile pins.
libsqlite3-sys = { version = "0.37", default-features = false, features = [
    "pkg-config",
] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Caching / geo
moka = { version = "0.12", features = ["future"] }
maxminddb = "0.32"

# Utilities
nanoid = "0.5"
regex = "1"
base64 = "0.23"
url = "2"
ipnet = "2"
percent-encoding = "2"
sha2 = "0.11"
hmac = "0.13"
rand = "0.10"
time = { version = "0.3", features = ["macros", "formatting"] }
thiserror = "2"
anyhow = "1"
# `O_NOFOLLOW` for the database and config file opens: the constant is
# platform-specific, so the value is read from libc instead of hardcoded.
libc = "0.2"
async-stream = "0.3"
futures-util = "0.3"
# Test-only: the self-signed certificate the T1 handshake tests serve.
rcgen = { version = "0.14", default-features = false, features = [
    "crypto",
    "pem",
    "ring",
] }

# Admin UI (SSR templates)
askama = "0.16"

[profile.release]
lto = "thin"
strip = true
