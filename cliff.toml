# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
# Dated image-snapshot changelog (rolling release): a section per publishing
# batch, keyed by the image sha-tag. The body template is deliberately flat,
# one machine-readable line per commit `date|sha|category|message`, because
# Tera cannot group by a computed attribute (the calendar day of a Unix
# timestamp); scripts/make-changelog.py does the day-sectioning from this
# draft on stdin, then a human pass rewrites the terse subjects and drops
# what never shipped in an image
# Pipeline: git-cliff --config cliff.toml | scripts/make-changelog.py
# Category mapping (Keep a Changelog taxonomy): feat → Added, fix → Fixed,
# perf/refactor/upd → Changed, docs/manual → Docs, chore and dependabot
# merges → dropped (they never change the shipped image)

[changelog]
header = """
# Changelog

Fumox ships as rolling image snapshots (`ghcr.io/viktor45/fumox:sha-<hash>`
plus the moving `latest`); this changelog lists what each published batch
of changes contains, newest first in the published changelog; the git-cliff
draft is oldest-first. Match the `sha-` tag of the image you pulled
(`docker images`) to the hash in a section header, or just diff your pull
date against the section dates.
"""
body = """
{% for commit in commits %}\
{{ commit.committer.timestamp | date(fmt="%Y-%m-%d") }}|{{ commit.id | truncate(length=7, end="") }}|{{ commit.group }}|{{ commit.message | upper_first | replace(from="\n", to=" ") }}
{% endfor %}\
"""
trim = true
render_always = true

[git]
conventional_commits = true
# Non-conventional subjects (Initial commit, Create README.md) are filed
# under Changed instead of being dropped
filter_unconventional = false
split_commits = false
# Oldest-first within a day: the script writes the day header at the
# batch's last commit, matching the image tag
sort_commits = "oldest"

commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Changed" },
    { message = "^refactor", group = "Changed" },
    { message = "^docs", group = "Docs" },
    { message = "^manual", group = "Docs" },
    { message = "^upd", group = "Changed" },
    # dependency bumps and merge noise never change the shipped image;
    # dependabot speaks both languages, conventional (`build(deps): bump
    # ...`) and plain (`Bump ... from ... to ...`); `filter_commits` below
    # removes everything the parsers mark `skip`
    { message = "^(build|chore)\\(deps\\)", group = "Internal", skip = true },
    { message = "^Bump .* from .* to ", group = "Internal", skip = true },
    { message = "^chore", group = "Internal", skip = true },
    { message = "^Merge pull request", group = "Internal", skip = true },
    { message = ".*", group = "Changed" },
]
filter_commits = true
