# Fumox — конфигурация приложения (SPEC §12, ADMIN_PLAN §2).
# Все ключи имеют дефолты: файл можно урезать до нужных секций или вовсе
# не создавать — сервис запустится «из коробки».
# Переопределение через окружение: FUMOX_СЕКЦИЯ__КЛЮЧ, например
# FUMOX_ADMIN__TOKEN=secret (двойное подчёркивание разделяет секции).
#
# Fumox — application configuration (SPEC §12, ADMIN_PLAN §2).
# Every key has a default: the file may be trimmed down to the sections you
# need or omitted entirely — the service runs out of the box.
# Environment overrides: FUMOX_SECTION__KEY, e.g. FUMOX_ADMIN__TOKEN=secret
# (a double underscore separates the section from the key).

[server]
# Публичный слушатель для GET /sub/{id} и GET /src/{id}.
# Public listener for GET /sub/{id} and GET /src/{id}.
bind = "0.0.0.0:8080"

[database]
# SQLite (WAL) — единственный источник истины.
# SQLite (WAL) — the single source of truth.
path = "fumox.db"
# обязателен: пишут два процесса (server и probe)
# required: two processes write to the database (server and probe)
busy_timeout_ms = 5000
max_connections = 8

[fetch]
# Загрузка источников (PLAN, пробелы 4–5, 12).
# Source fetching (PLAN, gaps 4–5, 12).
connect_timeout_secs = 10
read_timeout_secs = 30
max_response_bytes = 10485760   # 10 МиБ; защита от decompression-bomb / 10 MiB; decompression-bomb guard
max_concurrency = 4             # семафор параллельных загрузок / concurrency semaphore for fetches
# только для устранимых классов (network, http_server)
# retries apply only to recoverable error classes (network, http_server)
max_retries = 2
retry_base_backoff_ms = 500     # экспоненциальный backoff от этой базы / exponential backoff base for retries
# user_agent = "fumox/0.1"     # переопределяется headers конкретного источника / overridden by per-source headers
# Семейство протоколов по умолчанию для загрузки источников: any | ipv4 | ipv6.
# Источник без своего ip_family наследует это значение. any — dual-stack:
# первый IPv4-адрес, иначе IPv6. Выбранное семейство строгое: нет адреса
# нужного семейства — загрузка с ошибкой. Переопределение:
# FUMOX_FETCH__IP_FAMILY.
# Default IP protocol family for source fetching: any | ipv4 | ipv6. Sources
# without their own ip_family inherit this. any = dual-stack (first IPv4
# address wins, IPv6 fallback). The family is strict: no address of that
# family means a fetch error. Env override: FUMOX_FETCH__IP_FAMILY.
ip_family = "any"

[geo]
# Гео-обогащение MaxMind GeoLite2 (SPEC §6). Файлы .mmdb не коммитятся; при
# старте сервер сам скачивает отсутствующие/устаревшие базы в db_dir, если
# каталог доступен для записи.
# MaxMind GeoLite2 geo enrichment (SPEC §6). The .mmdb files are never
# committed; at startup the server downloads missing/stale databases into
# db_dir on its own, provided the directory is writable.
enabled = true
db = "country"                # country | city | asn (по умолчанию Country / Country by default)
db_dir = "data"             # каталог с GeoLite2-{Country,City,ASN}.mmdb / directory holding GeoLite2-{Country,City,ASN}.mmdb
cache_max_entries = 16384     # кэш host→geo (moka) / host→geo cache (moka)
dns_timeout_secs = 5

[admin]
# Админка (ADMIN_PLAN §2–3). Пустой token = админка отключена (отдаёт 404).
# Admin panel (ADMIN_PLAN §2–3). An empty token disables the panel (it answers 404).
enabled = true
token = "change-me"
# отдельный слушатель; наружу — reverse-proxy/SSH-туннель
# a separate listener; expose it through a reverse proxy or an SSH tunnel
bind = "127.0.0.1:8081"
session_ttl_hours = 168       # 7 дней / 7 days
allow_private_urls = false    # SSRF-защита источников / SSRF guard for source URLs
rate_limit = "120/min"        # /admin/* кроме login / /admin/* except login
login_rate_limit = "5/min"    # POST /admin/login
# каталог переводов админки (<код>.toml); новый файл = новый язык после рестарта
# admin UI translation catalogs (<code>.toml); a new file adds a language after restart
locales_dir = "locales"

[probe]
# Демон проверки живучести (SPEC §8).
# Health-check daemon (SPEC §8).
cycle_interval_secs = 600      # период цикла планирования / scheduling cycle period
sample_size = 50              # случайная выборка прокси за цикл (без всплесков) / random proxy sample per cycle (no bursts)
refresh_check_limit = 50      # новых unknown-прокси за обновление источника в приоритет-очередь (0 = выкл) / newly inserted unknown proxies per source refresh queued for priority checking (0 = off)
fail_limit = 3                # неудач подряд до карантина / consecutive failures before quarantine
connect_timeout_secs = 10     # T1: TCP-connect
tls_timeout_secs = 10         # T1: TLS-handshake
concurrency = 8
heartbeat_interval_secs = 30  # meta-ключ probe_heartbeat для админки / probe_heartbeat meta key consumed by the admin panel
# Второй шанс: окно [24ч, 48ч) после карантина (SPEC §8.3a):
# second_chance_at = quarantined_at + min + U(0..spread), UTC.
# Second chance: a recheck window of [24h, 48h) after quarantine (SPEC §8.3a):
# second_chance_at = quarantined_at + min + U(0..spread), UTC.
second_chance_min_hours = 24
second_chance_spread_hours = 24
retention_interval_secs = 86400   # период ротации истории / history rotation period

[meow]
# meow-rs — отдельный системный сервис (SPEC §8.2); Fumox им не управляет,
# только дёргает REST API и перезагружает конфиг через PUT /configs.
# meow-rs runs as a separate system service (SPEC §8.2); Fumox does not manage
# it — it only calls its REST API and reloads its config via PUT /configs.
api_addr = "127.0.0.1:9090"
config_path = "config/meow.yaml"  # Clash YAML, генерируется probe / Clash YAML generated by the probe
# Адрес(а) T2-проверки задержки через туннель: probe случайно выбирает один
# из списка на каждую проверку — выход одного адреса из строя не ломает T2.
# Можно задать один адрес, TOML-массив или строку с адресами через запятую
# (удобно для FUMOX_MEOW__TEST_URL). Ниже — актуальные адресы captive-проверки
# Android (проверены вживую 2026-08-29, все отвечают HTTP 204); уберите
# недоступные в вашем регионе. HTTPS-варианты (www.google.com,
# connectivitycheck.gstatic.com, play.googleapis.com) тоже живы, но дают
# лишний TLS-handshake внутри туннеля.
# Test URL(s) of the T2 tunnel delay check: the probe picks one at random
# per check — a dead endpoint no longer breaks T2. Accepts a single URL, a
# TOML array, or a comma-separated string (handy for FUMOX_MEOW__TEST_URL).
# Below are the current Android captive-portal endpoints (verified live
# 2026-08-29, all answer HTTP 204); drop the ones unreachable in your region.
# HTTPS variants (www.google.com, connectivitycheck.gstatic.com,
# play.googleapis.com) are alive too but add a TLS handshake inside the tunnel.
test_url = [
  "http://www.gstatic.com/generate_204",               # Android 5+ (primary since 7.1)
  "http://connectivitycheck.gstatic.com/generate_204", # Android 7.1+
  "http://www.google.com/generate_204",                # Android 4.2+ (fallback 9+)
  "http://www.googleapis.com/generate_204",            # Android 4.3+ (fallback)
  "http://play.googleapis.com/generate_204",           # Android 9+/11 fallback
  "http://connectivitycheck.android.com/generate_204", # legacy Android 4.x, still alive
  "http://clients3.google.com/generate_204",           # legacy Android 2.3-4.x, still alive
]
timeout_secs = 10

[retention]
# Ротация истории (ежедневная задача в probe).
# History rotation (a daily task in the probe daemon).
probe_results_days = 14
fetch_log_days = 30
