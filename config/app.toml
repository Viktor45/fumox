# Fumox — конфигурация приложения.
# Файл перечисляет ВСЕ доступные ключи со значениями по умолчанию — правьте
# только то, что нужно изменить. Каждый ключ имеет дефолт: файл можно урезать
# до нужных секций или вовсе не создавать — сервис запустится «из коробки».
# Переопределение через окружение: FUMOX_СЕКЦИЯ__КЛЮЧ, например
# FUMOX_ADMIN__TOKEN=secret (двойное подчёркивание разделяет секции).
#
# Fumox — application configuration.
# The file lists EVERY available key at its default value — change only what
# you need. Every key has a default: the file may be trimmed down to the
# sections you need or omitted entirely — the service runs out of the box.
# Environment overrides: FUMOX_SECTION__KEY, e.g. FUMOX_ADMIN__TOKEN=secret
# (a double underscore separates the section from the key).

[server]
# Публичный слушатель для GET /sub/{id} и GET /src/{id}.
# Public listener for GET /sub/{id} and GET /src/{id}.
bind = "0.0.0.0:8080"

[database]
# SQLite (WAL) — единственный источник истины.
# SQLite (WAL) — the single source of truth.
path = "fumox.db"
# обязателен: пишут два процесса (server и probe)
# required: two processes write to the database (server and probe)
busy_timeout_ms = 5000
max_connections = 8

[fetch]
# Загрузка источников по HTTP.
# Source fetching over HTTP.
connect_timeout_secs = 10
read_timeout_secs = 30
max_response_bytes = 10485760   # 10 МиБ; защита от decompression-bomb / 10 MiB; decompression-bomb guard
max_concurrency = 4             # семафор параллельных загрузок / concurrency semaphore for fetches
# только для устранимых классов (network, http_server)
# retries apply only to recoverable error classes (network, http_server)
max_retries = 2
retry_base_backoff_ms = 500     # экспоненциальный backoff от этой базы / exponential backoff base for retries
# Встроенный дефолт генерируется из версии бинарника (сейчас fumox/0.1.0):
# удалите строку — подставится актуальная версия при сборке. headers
# конкретного источника важнее этого значения.
# The built-in default is derived from the binary version (fumox/0.1.0 now):
# remove the line to inherit it at compile time. Per-source headers win.
user_agent = "fumox/0.1.0"
# Семейство протоколов по умолчанию для загрузки источников: any | ipv4 | ipv6.
# Источник без своего ip_family наследует это значение. any — dual-stack:
# первый IPv4-адрес, иначе IPv6. Выбранное семейство строгое: нет адреса
# нужного семейства — загрузка с ошибкой. Переопределение:
# FUMOX_FETCH__IP_FAMILY.
# Default IP protocol family for source fetching: any | ipv4 | ipv6. Sources
# without their own ip_family inherit this. any = dual-stack (first IPv4
# address wins, IPv6 fallback). The family is strict: no address of that
# family means a fetch error. Env override: FUMOX_FETCH__IP_FAMILY.
ip_family = "any"

[ingest]
# Инжест источников планировщиком fumox-server: fetch → parse → reconcile.
# Source ingestion by the fumox-server scheduler: fetch → parse → reconcile.
# новых unknown-прокси за обновление источника в приоритет-очередь (0 = выкл)
# newly inserted unknown proxies per source refresh queued for priority checking (0 = off)
refresh_check_limit = 50
# Как поступать с живым прокси, исчезнувшим из выдачи источника.
# false (дефолт): прокси остаётся за источником, пока проверки подтверждают,
# что он жив; как только проверки завалят его — прокси сам уйдёт из базы.
# true: если у источника есть правила отбрасывания (drop) в pipeline, живой
# прокси под таким правилом убирается уже на ближайшем обновлении.
# What happens to an alive proxy that vanished from a source feed.
# false (the default): the proxy stays linked to the source while checks
# keep confirming it is alive; once the checks fail it, the proxy leaves
# on its own. true: when the source has pipeline drop rules, an alive
# proxy caught by a rule is removed on the very next refresh.
drop_gate = false

[geo]
# Гео-обогащение MaxMind GeoLite2: по IP-адресу узла определяется страна
# (и город/автономная система при выборе другой базы). Файлы .mmdb не
# коммитятся; при старте сервер сам скачивает отсутствующие/устаревшие
# базы в db_dir, если каталог доступен для записи.
# MaxMind GeoLite2 geo enrichment: a node's IP resolves to its country
# (or city / autonomous system with a different database choice). The
# .mmdb files are never committed; at startup the server downloads
# missing/stale databases into db_dir on its own, provided the directory
# is writable.
enabled = true
db = "country"                # country | city | asn (по умолчанию Country / Country by default)
db_dir = "config"           # каталог с GeoLite2-{Country,City,ASN}.mmdb / directory holding GeoLite2-{Country,City,ASN}.mmdb
cache_max_entries = 16384     # кэш host→geo (moka) / host→geo cache (moka)
dns_timeout_secs = 5

[admin]
# Админка. Пустой token = админка отключена (отдаёт 404).
# Admin panel. An empty token disables the panel (it answers 404).
enabled = true
token = "change-me"
# отдельный слушатель; наружу — reverse-proxy/SSH-туннель
# a separate listener; expose it through a reverse proxy or an SSH tunnel
bind = "127.0.0.1:8081"
session_ttl_hours = 168       # 7 дней / 7 days
allow_private_urls = false    # SSRF-защита источников / SSRF guard for source URLs
rate_limit = "120/min"        # /admin/* кроме login / /admin/* except login
login_rate_limit = "5/min"    # POST /admin/login
# каталог переводов админки (<код>.toml); новый файл = новый язык после рестарта
# admin UI translation catalogs (<code>.toml); a new file adds a language after restart
locales_dir = "locales"

[probe]
# Демон проверки живучести прокси.
# Proxy health-check daemon.
cycle_interval_secs = 60       # период цикла планирования / scheduling cycle period
sample_size = 50              # случайная выборка прокси за цикл (без всплесков) / random proxy sample per cycle (no bursts)
fail_limit = 3                # неудач подряд до карантина / consecutive failures before quarantine
connect_timeout_secs = 10     # T1: TCP-connect
tls_timeout_secs = 10         # T1: TLS-handshake
concurrency = 8
heartbeat_interval_secs = 30  # meta-ключ probe_heartbeat для админки / probe_heartbeat meta key consumed by the admin panel
# Второй шанс для прокси в карантине: повторная проверка в случайный момент
# окна [24ч, 48ч) после карантина — окно задаётся как min + случайная
# добавка от 0 до spread (UTC, момент фиксируется в базе на момент карантина).
# A quarantined proxy's second chance: rechecked at a random moment of the
# [24h, 48h) window after quarantine — the window is min plus a random
# addition from 0 to spread (UTC, the moment is fixed in the database when
# quarantined).
second_chance_min_hours = 24
second_chance_spread_hours = 24
retention_interval_secs = 86400   # период ротации истории / history rotation period

[meow]
# meow-rs — движок реальных туннельных проверок. Живёт как отдельный
# системный сервис: Fumox им не управляет, только дёргает его REST API
# и перезагружает конфиг через PUT /configs.
# meow-rs — the engine behind real tunnel checks. It runs as a separate
# system service: Fumox does not manage it, it only calls its REST API
# and reloads its config via PUT /configs.
api_addr = "127.0.0.1:9090"
config_path = "/shared/meow.yaml"  # Clash YAML, генерируется probe / Clash YAML generated by the probe
# Адрес(а) T2-проверки задержки через туннель: probe случайно выбирает один
# из списка на каждую проверку — выход одного адреса из строя не ломает T2.
# Можно задать один адрес, TOML-массив или строку с адресами через запятую
# (удобно для FUMOX_MEOW__TEST_URL). Ниже — актуальные адресы captive-проверки
# Android (проверены вживую 2026-08-29, все отвечают HTTP 204); уберите
# недоступные в вашем регионе. HTTPS-варианты (www.google.com,
# connectivitycheck.gstatic.com, play.googleapis.com) тоже живы, но дают
# лишний TLS-handshake внутри туннеля.
# Test URL(s) of the T2 tunnel delay check: the probe picks one at random
# per check — a dead endpoint no longer breaks T2. Accepts a single URL, a
# TOML array, or a comma-separated string (handy for FUMOX_MEOW__TEST_URL).
# Below are the current Android captive-portal endpoints (verified live
# 2026-08-29, all answer HTTP 204); drop the ones unreachable in your region.
# HTTPS variants (www.google.com, connectivitycheck.gstatic.com,
# play.googleapis.com) are alive too but add a TLS handshake inside the tunnel.
test_url = [
  "http://www.gstatic.com/generate_204",               # Android 5+ (primary since 7.1)
  "http://connectivitycheck.gstatic.com/generate_204", # Android 7.1+
  "http://www.google.com/generate_204",                # Android 4.2+ (fallback 9+)
  "http://www.googleapis.com/generate_204",            # Android 4.3+ (fallback)
  "http://play.googleapis.com/generate_204",           # Android 9+/11 fallback
  "http://connectivitycheck.android.com/generate_204", # legacy Android 4.x, still alive
  "http://clients3.google.com/generate_204",           # legacy Android 2.3-4.x, still alive
]
timeout_secs = 10

[retention]
# Ротация истории (ежедневная задача в probe).
# History rotation (a daily task in the probe daemon).
probe_results_days = 14
fetch_log_days = 30

[log]
# Уровень консольных логов каждого процесса: error | warn | info | debug | trace.
# Оба процесса читают этот файл, поэтому ключ свой у каждого: server — для
# fumox-server, probe — для fumox-probe (probe на info пишет строку «probe
# cycle done» каждый цикл; warn её убирает). Полные директивы EnvFilter в
# RUST_LOG имеют приоритет над конфигом (например RUST_LOG=fumox_core=debug,info).
# Console log level per process: error | warn | info | debug | trace. Both
# processes read this file, so each has its own key: server for fumox-server,
# probe for fumox-probe (at info the probe prints a «probe cycle done» line
# every cycle; warn silences it). Full EnvFilter directives in RUST_LOG take
# precedence over the config (e.g. RUST_LOG=fumox_core=debug,info).
server = "info"
probe = "info"
