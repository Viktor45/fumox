# Fumox — конфигурация приложения (SPEC §12, ADMIN_PLAN §2).
# Все ключи имеют дефолты: файл можно урезать до нужных секций или вовсе
# не создавать — сервис запустится «из коробки».
# Переопределение через окружение: FUMOX_СЕКЦИЯ__КЛЮЧ, например
# FUMOX_ADMIN__TOKEN=secret (двойное подчёркивание разделяет секции).

[server]
# Публичный слушатель для GET /sub/{id} и GET /src/{id}.
bind = "0.0.0.0:8080"

[database]
# SQLite (WAL) — единственный источник истины.
path = "fumox.db"
busy_timeout_ms = 5000      # обязателен: пишут два процесса (server и probe)
max_connections = 8

[fetch]
# Загрузка источников (PLAN, пробелы 4–5, 12).
connect_timeout_secs = 10
read_timeout_secs = 30
max_response_bytes = 10485760   # 10 МиБ; защита от decompression-bomb
max_concurrency = 4             # семафор параллельных загрузок
max_retries = 2                 # только для устранимых классов (network, http_server)
retry_base_backoff_ms = 500     # экспоненциальный backoff от этой базы
# user_agent = "fumox/0.1"     # переопределяется headers конкретного источника

[geo]
# Гео-обогащение MaxMind GeoLite2 (SPEC §6). Файлы .mmdb не коммитятся.
enabled = true
db = "country"                # country | city | asn (по умолчанию Country)
db_dir = "config"             # каталог с GeoLite2-{Country,City,ASN}.mmdb
cache_max_entries = 16384     # кэш host→geo (moka)
dns_timeout_secs = 5

[admin]
# Админка (ADMIN_PLAN §2–3). Пустой token = админка отключена (отдаёт 404).
enabled = true
token = "change-me"
bind = "127.0.0.1:8081"       # отдельный слушатель; наружу — reverse-proxy/SSH-туннель
session_ttl_hours = 168       # 7 дней
allow_private_urls = false    # SSRF-защита источников
rate_limit = "120/min"        # /admin/* кроме login
login_rate_limit = "5/min"    # POST /admin/login
locales_dir = "locales"       # каталог переводов админки (<код>.toml); новый файл = новый язык после рестарта

[probe]
# Демон проверки живучести (SPEC §8).
cycle_interval_secs = 60      # период цикла планирования
sample_size = 50              # случайная выборка прокси за цикл (без всплесков)
fail_limit = 3                # неудач подряд до карантина
connect_timeout_secs = 10     # T1: TCP-connect
tls_timeout_secs = 10         # T1: TLS-handshake
concurrency = 8
heartbeat_interval_secs = 30  # meta-ключ probe_heartbeat для админки
# Второй шанс: окно [24ч, 48ч) после карантина (SPEC §8.3a):
# second_chance_at = quarantined_at + min + U(0..spread), UTC.
second_chance_min_hours = 24
second_chance_spread_hours = 24
retention_interval_secs = 86400   # период ротации истории

[meow]
# meow-rs — отдельный системный сервис (SPEC §8.2); Fumox им не управляет,
# только дёргает REST API и перезагружает конфиг через PUT /configs.
api_addr = "127.0.0.1:9090"
config_path = "config/meow.yaml"  # Clash YAML, генерируется probe
test_url = "http://www.gstatic.com/generate_204"  # может быть заблокирован — поменять
timeout_secs = 10

[retention]
# Ротация истории (ежедневная задача в probe).
probe_results_days = 14
fetch_log_days = 30
