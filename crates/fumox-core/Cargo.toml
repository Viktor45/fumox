[package]
name = "fumox-core"
description = "Fumox shared library: models, SQLite schema, protocol parsers, geo, fingerprint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# The repair utility lives in examples/ but is a bin, not an example.
# Disable example auto-discovery so cargo does not also claim the file as
# an example target, which warns about one source in two build targets.
autoexamples = false

# The migration-repair utility is a binary target whose source sits in
# examples/: integration tests run it through `CARGO_BIN_EXE_…`, and cargo
# builds bin targets before it compiles the tests that reference them, so
# a targeted `cargo test --test migration_repair` needs no prior build.
[[bin]]
name = "repair_migration_checksums"
path = "examples/repair_migration_checksums.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
figment = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
sqlx = { workspace = true }
# The SQLite authorizer that restricts what the probe may write.
libsqlite3-sys = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
nanoid = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
percent-encoding = { workspace = true }
tokio = { workspace = true }
moka = { workspace = true }
maxminddb = { workspace = true }
libc = { workspace = true }
# CIDR parsing for the trusted-proxy allowlist (config validation).
ipnet = { workspace = true }
# Parsing the `[meow].test_url` entries (scheme and host checks).
url = { workspace = true }
# Installing the process-wide rustls crypto provider.
rustls = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
