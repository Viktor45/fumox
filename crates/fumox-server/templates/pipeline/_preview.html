{# Pipeline builder preview: the target of
   POST /admin/pipeline/preview. Shows the generated JSON and the verdict of
   the same validator the save path uses. #}
{% match json %}
  {% when Some with (value) %}
  {#- A heading, not a `<label>`: the `<pre>` is not a form control, and
      the heading id lets the `<pre>` name its own caption. -#}
  <h3 id="ped-preview-title" class="ped-section-heading">{{ self.t("ped.preview_title") }}</h3>
  <pre class="mono ped-preview-json" aria-labelledby="ped-preview-title" aria-live="off">{{ value }}</pre>
  {% if valid %}
    <span class="badge on">{{ self.t("ped.preview_ok") }}</span>
  {% else %}
    <span class="badge off">{{ self.t("ped.preview_invalid") }}</span>
    {% for error in errors %}
    <div class="error-text">{{ error }}</div>
    {% endfor %}
  {% endif %}
  {% when None %}
  {# "Empty" is the pass-through config: the stored field stays NULL and the
     built-in defaults apply, all protocols kept, parameters normalized,
     quarantined/removed excluded, dedup by fingerprint. #}
  <div class="hint">{{ self.t("ped.preview_empty") }}</div>
{% endmatch %}
