# Local build overlay for docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# The base file pins the published images by digest; a digest cannot be a
# build tag ("build tag cannot contain a digest"), so the build path lives
# in this overlay: it replaces the pinned references with local tags and
# adds the build sections. The two files are meant to be used together,
# never on their own: the overlay alone has no services of its own.
#
# The meow wrapper pins the upstream release: MEOW_VERSION names a
# concrete tag and the two sums are the ones the upstream release
# publishes for its musl archives. Bumping the version means bumping the
# sums in the same edit (the build refuses a download whose hash does not
# match), so a new upstream release is picked up through review, not by
# accident.

services:
  server:
    image: localhost/fumox:local
    build:
      context: .
      dockerfile: Dockerfile
      # `mounts` builds through persistent BuildKit cache mounts: rebuilds
      # after a source change recompile only the workspace crates (~1 min
      # instead of ~7.5). Set FUMOX_BUILD_CACHE=layers in .env on builders
      # without cache-mount support (e.g. podman-compose), that path uses
      # the classic cargo-chef image layers. See the Dockerfile header.
      args:
        BUILD_CACHE: ${FUMOX_BUILD_CACHE:-mounts}

  # The probe runs the same binary as the server, so it uses the same
  # local image; no second build section is needed.
  probe:
    image: localhost/fumox:local

  meow:
    image: localhost/fumox-meow:local
    build:
      context: ./docker/meow
      dockerfile: Dockerfile
      args:
        MEOW_VERSION: ${MEOW_VERSION:-v0.29.0}
        MEOW_SHA256_AMD64: ${MEOW_SHA256_AMD64:-92fe902cca5e95799af02a42fcda9a4f9195aa61ec126057b51b15a8d2116ca2}
        MEOW_SHA256_ARM64: ${MEOW_SHA256_ARM64:-6fa37f13ddeaafae605e65bc9f2ab0c538b9ab3fad11c8b12180f0a52b4c06b7}
