# Local build overlay for docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# The base file pins the published images by digest and a build tag cannot
# carry a digest, so this overlay swaps in local tags and adds the build
# sections. Used together with the base file, never alone: it has no
# services of its own
# The meow wrapper pins the upstream release: MEOW_VERSION and the two
# musl-archive sums the upstream release publishes are bumped together in
# the same edit, the build refuses a download whose hash does not match,
# so a new upstream release is picked up through review, not by accident

services:
  server:
    image: localhost/fumox:local
    build:
      context: .
      dockerfile: Dockerfile
      # `mounts` builds through persistent BuildKit cache mounts: rebuilds
      # after a source change recompile only the workspace crates (~1 min
      # instead of ~7.5). Set FUMOX_BUILD_CACHE=layers in .env on builders
      # without cache-mount support (e.g. podman-compose), see the
      # Dockerfile header
      args:
        BUILD_CACHE: ${FUMOX_BUILD_CACHE:-mounts}

  # Same binary as the server, so the same local image, no second build
  # section needed
  probe:
    image: localhost/fumox:local

  meow:
    image: localhost/fumox-meow:local
    build:
      context: ./docker/meow
      dockerfile: Dockerfile
      args:
        MEOW_VERSION: ${MEOW_VERSION:-v0.29.0}
        MEOW_SHA256_AMD64: ${MEOW_SHA256_AMD64:-92fe902cca5e95799af02a42fcda9a4f9195aa61ec126057b51b15a8d2116ca2}
        MEOW_SHA256_ARM64: ${MEOW_SHA256_ARM64:-6fa37f13ddeaafae605e65bc9f2ab0c538b9ab3fad11c8b12180f0a52b4c06b7}
