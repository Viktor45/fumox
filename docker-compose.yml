# Fumox + meow-rs, one-command deployment: three containers (server, probe,
# meow) wired through shared volumes and env overrides
#
# Quick start:
#   cp .env.example .env        # then set FUMOX_ADMIN__TOKEN and
#                               # FUMOX_MEOW__API_TOKEN
#   docker compose up -d        # pull the pinned images and start
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#                               # ...or build server + meow locally from source
#   open http://127.0.0.1:8081/admin   # admin panel (login with the token)
#
# Images are pinned by digest (`image:` lines): one immutable manifest, so a
# deployment cannot change under a running stack. docker-compose.build.yml
# is the overlay replacing them with local builds; the two never mix, a
# build tag cannot carry a digest
#
# Probe ↔ meow wiring:
#   - probe reaches the meow-rs REST API at meow:9090 (FUMOX_MEOW__API_ADDR)
#   - probe renders the T2 batch to /shared/meow/meow.yaml and calls PUT
#     /configs with that exact path, so BOTH containers mount the meow
#     volume at the same location (FUMOX_MEOW__CONFIG_PATH=/shared/meow/meow.yaml)
#   - the controller (9090) is reachable only from the probe over the
#     dedicated `meow` network, deliberately not published to the host,
#     and answers only to a caller presenting the controller secret
#     (FUMOX_MEOW__API_TOKEN)
#
# Config: the services point the loader at the mounted ./config volume
# (FUMOX_CONFIG=/app/config/app.toml, the default the image would use
# anyway); set FUMOX_CONFIG in .env for another file name inside that
# volume, the mounted file must exist, a missing one is a startup error
#
# Volumes:
#   fumox-data   SQLite database, shared by server and probe -> /app/data
#   fumox-geo    GeoLite2 .mmdb files, written by the server -> /shared/geo
#   fumox-meow   generated Clash config exchange             -> /shared/meow
#   ./config     app.toml -> /app/config (probe always :ro; the server :rw
#                so the admin *Edit settings* page can save, or :ro with
#                FUMOX_CONFIG_ACCESS=ro)
#
# Every container runs as a non-root user with no capabilities and a
# read-only root filesystem; every path a binary writes to is a volume, a
# bind mount or a tmpfs (/tmp for the SQLite scratch files, /run/meow for
# the rendered kernel config)
#
# GeoLite2 .mmdb files do NOT go into ./config: FUMOX_GEO__DB_DIR=/shared/geo
# (the geo volume) outranks config/app.toml, so ./config is never scanned
# for databases. The server downloads them into /shared/geo at startup; to
# supply your own MaxMind files:
#   docker compose cp GeoLite2-City.mmdb server:/shared/geo/
# or drop the FUMOX_GEO__DB_DIR override and set [geo].db_dir instead

services:
  server:
    image: ${FUMOX_IMAGE:-ghcr.io/viktor45/fumox@sha256:6490bda1a14b3ce12b5192121cfb92ffca220761a732661f4bd2a79d8373f466}
    command: ["fumox-server"]
    # The image already runs as uid/gid 999; the explicit line keeps the
    # guarantee visible in the deployment and survives an image change
    user: "999:999"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      # SQLite scratch directory; nothing else on the image is writable
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    environment:
      FUMOX_CONFIG: ${FUMOX_CONFIG:-/app/config/app.toml}
      # The panel is off without a token; "change-me" is not a token, the
      # server refuses to start with it on a non-loopback bind
      FUMOX_ADMIN__TOKEN: ${FUMOX_ADMIN__TOKEN:?set FUMOX_ADMIN__TOKEN in .env (a random value, not "change-me")}
      # compose defaults true (ready for an HTTPS front), so a plain-HTTP
      # stand must pin FUMOX_ADMIN__SECURE_COOKIES=false in .env (browsers
      # drop Secure cookies on http://). `${VAR-true}` without the colon:
      # the default applies only when the variable is unset, an empty .env
      # value passes through as-is instead of being masked by `true`
      FUMOX_ADMIN__SECURE_COOKIES: ${FUMOX_ADMIN__SECURE_COOKIES-true}
      # Outranks [geo].db_dir in config/app.toml: the databases live in the
      # geo volume, not in ./config (see the Volumes header)
      FUMOX_GEO__DB_DIR: /shared/geo
      # SSRF guard: true in .env only for trusted local test setups (source
      # URLs may then point at private/loopback addresses)
      FUMOX_ADMIN__ALLOW_PRIVATE_URLS: ${FUMOX_ADMIN__ALLOW_PRIVATE_URLS:-false}
    volumes:
      # :rw because the admin *Edit settings* page writes app.toml in place
      # via the toml_edit-backed editor (FUMOX_CONFIG_ACCESS=ro turns edits
      # off). scripts/smoke-up.sh mounts :ro: only the named volumes are
      # project-scoped, the bind mount is the same host ./config for every
      # compose project, so a writable mount would let the smoke stand's
      # admin panel overwrite the main stack's app.toml
      - ./config:/app/config:${FUMOX_CONFIG_ACCESS:-rw},z
      - fumox-data:/app/data
      - fumox-geo:/shared/geo
    ports:
      # Parameterized so a second, isolated stand (the smoke scripts in
      # scripts/) can run alongside the main one
      - "${FUMOX_PUBLIC_PORT:-8080}:8080"            # public subscription endpoints
      - "${FUMOX_ADMIN_BIND:-127.0.0.1}:${FUMOX_ADMIN_PORT:-8081}:8081"   # admin panel: loopback-only by
      # default; put a reverse proxy / SSH tunnel in front to expose it
    # Readiness gate for probe.depends_on: migrations run before the
    # listeners bind, a 200 means the schema is current, so the probe cannot
    # race the server into a second CREATE INDEX on a large `proxies` table.
    # The image ships no curl or wget, the probe is the binary itself
    healthcheck:
      test: ["CMD", "fumox-server", "--health-check"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
      # HTTPS front (optional): docker/nginx/ holds a ready example, nginx
      # terminating TLS for /sub (→ server:8080) and /admin (→ server:8081),
      # with ACME challenges on port 80. Add:
      #   frontend:
      #     build: { context: docker/nginx }
      #     ports: ["443:443", "80:80"]
      #     volumes:
      #       - ./docker/nginx/certs:/certs:ro     # fullchain.pem + privkey.pem
      # and set FUMOX_ADMIN__SECURE_COOKIES=true. The server ports above can
      # then be unpublished entirely, nginx reaches both listeners over the
      # compose network
      # The front needs three keys per listener, in ./config/app.toml (the
      # file this stack mounts; the proxy's CIDR is the compose network it
      # sits on):
      #   [server]                         [admin]
      #   trust_proxy_ips  = ["172.20.0.0/16"]   (the proxy's subnet)
      #   trust_proxy_header = "xff"             (the X-Forwarded-* family)
      #   allowed_hosts    = ["fumox.example.com"]
      # Without them every request shares the proxy's IP (one rate-limit
      # budget for the whole fleet), the rendered links stay http behind the
      # TLS front, and the Host header is trusted as-is, which is what the
      # allowlist stops. The startup log names a trust_proxy_ips without a
      # trust_proxy_header
      # The public hostname must be on BOTH lists: the panel gates the
      # request on [admin].allowed_hosts and builds the export link from the
      # host you opened the panel on, while the public listener gates the
      # link on [server].allowed_hosts
    restart: unless-stopped
    # Rotating json-file logs: the public listener answers client pulls all
    # day, unbounded logs would eat the host disk
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # Same quotas the quadlet units pin (MemoryMax/CPUQuota/TasksMax) and
    # the kube manifest sets (resources)
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    networks:
      - default

  probe:
    image: ${FUMOX_IMAGE:-ghcr.io/viktor45/fumox@sha256:6490bda1a14b3ce12b5192121cfb92ffca220761a732661f4bd2a79d8373f466}
    command: ["fumox-probe"]
    user: "999:999"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    depends_on:
      # service_healthy, not a bare list entry: it must also wait for the
      # server to finish migrating the shared volume
      server:
        condition: service_healthy
      # service_healthy, not service_started: the probe drives the
      # controller as soon as its first T2 batch is due, the REST API must
      # already be listening
      meow:
        condition: service_healthy
    environment:
      FUMOX_CONFIG: ${FUMOX_CONFIG:-/app/config/app.toml}
      FUMOX_MEOW__API_ADDR: meow:9090
      FUMOX_MEOW__CONFIG_PATH: /shared/meow/meow.yaml
      # The controller secret: the probe presents it as
      # `Authorization: Bearer <token>`, the kernel refuses everything else.
      # The probe never sees the admin token
      FUMOX_MEOW__API_TOKEN: ${FUMOX_MEOW__API_TOKEN:?set FUMOX_MEOW__API_TOKEN in .env (openssl rand -hex 32)}
      # Override in .env when the default test URL is blocked in your
      # region. HTTPS only: a plain-HTTP answer would not prove a tunnel
      # is up, only that something answered
      FUMOX_MEOW__TEST_URL: ${FUMOX_MEOW__TEST_URL:-https://www.gstatic.com/generate_204}
      # SSRF guard mirroring ALLOW_PRIVATE_URLS: feeds are untrusted, the
      # probe must not dial loopback/RFC1918/link-local/CGNAT targets they
      # carry. True only for isolated test infrastructure
      FUMOX_PROBE__ALLOW_PRIVATE_TARGETS: ${FUMOX_PROBE__ALLOW_PRIVATE_TARGETS:-false}
    volumes:
      # :ro: the probe only reads app.toml, so a buggy probe can never
      # mangle the config the server is also editing
      - ./config:/app/config:ro,z
      - fumox-data:/app/data
      - fumox-meow:/shared/meow
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # Same quotas as fumox-probe.container (MemoryMax/CPUQuota/TasksMax)
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 128
    networks:
      # The default network carries the outbound traffic, the `meow`
      # network is the only path to the kernel's controller
      - default
      - meow

  meow:
    # Pinned by digest like the fumox image; the GHCR image is published
    # manually via .github/workflows/docker-meow.yml
    image: ${FUMOX_MEOW_IMAGE:-ghcr.io/viktor45/fumox-meow@sha256:49e91fa751672db22916982ed4cb97423d7aaaa667cf4984e973f613f2406e7b}
    user: "998:999"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      # The rendered kernel config (it carries the controller secret) and
      # the kernel's own data directory live on RAM only
      - /run/meow:rw,noexec,nosuid,nodev,mode=1777,size=16m
    environment:
      # The kernel refuses to start without one: an unauthenticated
      # controller can rewrite the proxy configuration
      FUMOX_MEOW__API_TOKEN: ${FUMOX_MEOW__API_TOKEN:?set FUMOX_MEOW__API_TOKEN in .env (openssl rand -hex 32)}
      # Compose: the probe reaches the controller over the network. In the
      # pod layouts (quadlet/kube) the probe shares the network namespace,
      # the address is 127.0.0.1 instead
      FUMOX_MEOW_API_BIND: 0.0.0.0:9090
    volumes:
      - fumox-meow:/shared/meow
    # Readiness gate for the probe (condition: service_healthy above); the
    # image ships no curl or wget, so the check is a plain TCP connect via
    # busybox nc (the controller secret is checked per-request by the
    # kernel itself)
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -w 2 127.0.0.1 9090 </dev/null >/dev/null 2>&1"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    # Same quotas as fumox-meow.container (MemoryMax/CPUQuota/TasksMax)
    mem_limit: 256m
    cpus: "0.75"
    pids_limit: 128
    networks:
      # The kernel dials the proxies under test, so it needs the outbound
      # path the default network provides; the controller stays unpublished
      - default
      - meow

volumes:
  fumox-data:
  fumox-geo:
  fumox-meow:

networks:
  # Probe ↔ kernel traffic only; the server is not on it, so it cannot
  # reach the controller at all
  meow:
