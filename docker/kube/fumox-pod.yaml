# Fumox pod manifests for `podman kube play`, the .kube quadlet alternative
# to docker-compose.yml. TWO pods:
#   fumox         the server: public /sub + /src on :8080, admin panel on
#                 :8081 (loopback-only on the host)
#   fumox-worker  the probe and the meow-rs kernel, wired over the pod
#                 loopback (FUMOX_MEOW__API_ADDR=127.0.0.1:9090)
# The split is the point: the kernel handles untrusted proxy traffic and its
# configuration is writable by the probe, so it must not reach the admin
# panel, not even inside a shared network namespace. No other network path
# is needed: the server and the probe exchange everything through the
# shared SQLite volume, the probe and the kernel through the shared config
# volume
# Before first start:
#   1. Prepare both images (quadlet/.kube do not build): pull+tag the GHCR
#      ones (docker/README.md) or build locally:
#        podman build -t localhost/fumox:local .
#        podman build -t localhost/fumox-meow:local docker/meow
#   2. Adjust the hostPath "config" below: a directory with app.toml. The
#      GeoLite2 databases do not belong there: FUMOX_GEO__DB_DIR points
#      them at the geo PVC on /shared/geo (docker/README.md)
#   3. Create the two secrets, separate on purpose: the admin token belongs
#      to the server alone and must never reach the probe.
#        printf 'FUMOX_ADMIN__TOKEN=%s\n' "$(openssl rand -hex 32)" \
#          | podman secret create fumox-admin -
#        printf 'FUMOX_MEOW__API_TOKEN=%s\n' "$(openssl rand -hex 32)" \
#          | podman secret create fumox-env -
#      `fumox-env` carries what the probe and the kernel share (the
#      controller secret, optionally FUMOX_MEOW__TEST_URL /
#      FUMOX_PROBE__ALLOW_PRIVATE_TARGETS); `fumox-admin` carries the admin
#      login token and is attached to the server container only.
#      FUMOX_ADMIN__SECURE_COOKIES: the panel is published on plain
#      http://127.0.0.1:8081, so the session cookie must not carry Secure
#      (browsers drop it and every login redirects back to /admin/login);
#      add `FUMOX_ADMIN__SECURE_COOKIES=false` to the fumox-admin secret,
#      true only when TLS is terminated in front of the panel
#   4. The PVCs fumox-data / fumox-geo / fumox-meow are backed by podman
#      named volumes created on first start; both pods mount the same
#      claims, so the database and the config exchange are shared
# Start order: all containers start at once, an init container cannot wait
# for the server here (init containers run BEFORE the app containers, it
# would deadlock the pod). The probe does not need the server: it reads the
# proxy list from the database and writes verdicts back; the one shared
# resource is the schema, both sides apply it on startup, SQLite serializes
# the two writers and the loser retries until the lock is free
# (connect_probe_pool in crates/fumox-core/src/db.rs). Compose gates the
# probe on the server healthcheck instead; the pod layout does not need it
# Verify the loopback admin binding after start: `podman port fumox`; if
# your podman ignores hostIP (old versions), 8081 lands on all interfaces,
# restrict it with a firewall or upgrade podman
apiVersion: v1
kind: Pod
metadata:
  name: fumox
  labels:
    app: fumox
spec:
  containers:
    # Public /sub + /src on :8080; admin panel on :8081. Default CMD of the
    # image (fumox-server behind tini) is exactly what compose runs.
    - name: server
      image: localhost/fumox:local
      env:
        - name: FUMOX_GEO__DB_DIR
          value: /shared/geo
      envFrom:
        # The shared variables (the controller secret and the overrides)
        - secretRef:
            name: fumox-env
        # The admin token, the server alone: neither the probe nor the
        # kernel gets it, so a defect in the probe cannot reach the panel
        - secretRef:
            name: fumox-admin
      ports:
        - containerPort: 8080
          hostPort: 8080
          protocol: TCP
        - containerPort: 8081
          hostPort: 8081
          hostIP: "127.0.0.1" # loopback-only admin, like the compose mapping
          protocol: TCP
      # Liveness and readiness on /healthz, the same endpoint the compose
      # healthcheck drives; podman kube play executes both probe kinds
      # (podman-kube-play(1))
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 15
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 15
        failureThreshold: 3
      # Same quotas the quadlet units pin (MemoryMax/CPUQuota/TasksMax) and
      # compose sets (mem_limit/cpus/pids_limit)
      resources:
        requests:
          memory: 512Mi
          cpu: "1"
        limits:
          memory: 512Mi
          cpu: "1"
      volumeMounts:
        # Writable on the server: the admin *Edit settings* page writes
        # /app/config/app.toml in place via the toml_edit-backed editor
        # (USERGUIDE §7); set `readOnly: true` to turn edits off, the editor
        # renders disabled with `set.edit_unwritable`
        - name: config
          mountPath: /app/config
        - name: data
          mountPath: /app/data
        - name: geo
          mountPath: /shared/geo
        - name: tmp
          mountPath: /tmp
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault

  volumes:
    - name: config
      hostPath:
        path: /opt/fumox/config # <-- adjust: must contain app.toml (mmdb files come from /shared/geo, see docker/README.md)
        type: Directory
    - name: data
      persistentVolumeClaim:
        claimName: fumox-data
    - name: geo
      persistentVolumeClaim:
        claimName: fumox-geo
    # SQLite scratch files
    - name: tmp
      emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: fumox-worker
  labels:
    app: fumox
    app.kubernetes.io/component: worker
spec:
  containers:
    # args: (not command:) keeps tini as the entrypoint, mirroring compose
    - name: probe
      image: localhost/fumox:local
      args: ["fumox-probe"]
      env:
        - name: FUMOX_MEOW__API_ADDR
          value: "127.0.0.1:9090"
        - name: FUMOX_MEOW__CONFIG_PATH
          value: /shared/meow/meow.yaml
      envFrom:
        # The controller secret only: the admin token is not here, the
        # probe never sees it
        - secretRef:
            name: fumox-env
      volumeMounts:
        # Probe reads app.toml at startup, never writes. Read-only mounts
        # are independent per container in a Pod, so the server stays
        # writable while the probe stays read-only
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: data
          mountPath: /app/data
        - name: meow
          mountPath: /shared/meow
        - name: tmp
          mountPath: /tmp
      # Smaller quota than the server, same as fumox-probe.container
      resources:
        requests:
          memory: 256Mi
          cpu: "0.5"
        limits:
          memory: 256Mi
          cpu: "0.5"
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault

    # meow-rs kernel: the bootstrap config is rendered at startup from the
    # template in the image and binds the external-controller to the pod
    # loopback (allow-lan: false); nothing here is published to the host
    - name: meow
      image: localhost/fumox-meow:local
      env:
        # The probe shares the pod's network namespace, so the controller
        # stays on the loopback address: no other container of the pod (and
        # nothing outside it) reaches it
        - name: FUMOX_MEOW_API_BIND
          value: "127.0.0.1:9090"
      envFrom:
        - secretRef:
            name: fumox-env
      volumeMounts:
        - name: meow
          mountPath: /shared/meow
        # The rendered config (it carries the controller secret) and the
        # kernel's data directory live on RAM only
        - name: meow-run
          mountPath: /run/meow
      # Same quota as fumox-meow.container (the kernel only samples proxies
      # for T2, the heavy work stays in the server quota)
      resources:
        requests:
          memory: 256Mi
          cpu: "0.75"
        limits:
          memory: 256Mi
          cpu: "0.75"
      securityContext:
        runAsNonRoot: true
        runAsUser: 998
        runAsGroup: 999
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault

  volumes:
    - name: config
      hostPath:
        path: /opt/fumox/config # <-- adjust: must contain app.toml (mmdb files come from /shared/geo, see docker/README.md)
        type: Directory
    - name: data
      persistentVolumeClaim:
        claimName: fumox-data
    - name: meow
      persistentVolumeClaim:
        claimName: fumox-meow
    # SQLite scratch files
    - name: tmp
      emptyDir: {}
    - name: meow-run
      emptyDir:
        medium: Memory
