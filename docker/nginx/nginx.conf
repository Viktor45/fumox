# Fumox TLS front, example configuration
# Terminates HTTPS for both Fumox listeners:
#   /sub, /src, /export, /healthz → the public listener
#   /admin                          → the admin panel
# The server blocks live in templates/default.conf.template and are
# rendered by the nginx image's entrypoint into /etc/nginx/conf.d/; the
# upstream addresses are runtime variables, so the same image serves every
# deployment variant:
#   FUMOX_UPSTREAM_PUBLIC  the public listener (default server:8080)
#   FUMOX_UPSTREAM_ADMIN   the admin panel (default server:8081)
#   FUMOX_SERVER_NAME      the canonical name of the deployment
#                          (default fumox.example.com)
# Two flavours, selected at build time (ARG NGINX_FLAVOUR):
#   compose  the upstreams are the compose service names, resolved through
#            Docker's embedded DNS (127.0.0.11); the default and the only
#            flavour that needs a resolver
#   podman   nginx runs INSIDE the server pod (docker/README.md, "HTTPS for
#            quadlet/kube"), the server is on the pod loopback and the
#            upstreams are FUMOX_UPSTREAM_PUBLIC=127.0.0.1:8080 and
#            FUMOX_UPSTREAM_ADMIN=127.0.0.1:8081; a loopback upstream needs
#            no resolver, so the podman flavour ships an empty resolver.conf
# Bring-up:
#   1. certs: ./docker/nginx/certs/fullchain.pem + privkey.pem (Let's
#      Encrypt layout, see the Dockerfile header)
#   2. set FUMOX_SERVER_NAME to your domain (or "_" for a bare IP)
#   3. set `[admin].secure_cookies = true` (FUMOX_ADMIN__SECURE_COOKIES=true
#      in .env): behind this front the panel is only reachable via HTTPS,
#      and the `Secure` cookie flag makes browsers keep the session cookie
#      on TLS-only connections
#   4. the Host header is normalised before it is forwarded (the
#      $fumox_host map in the template): default ports dropped, a
#      non-default port kept, a Host that is not a plain hostname replaced
#      by the canonical name; which names are accepted at all is Fumox's
#      call: [server].allowed_hosts (FUMOX_SERVER__ALLOWED_HOSTS)
# Tuning notes:
#   * the admin panel opens an SSE stream at /admin/events, it has its own
#     location with buffering off and a long read timeout, the remaining
#     /admin locations answer in seconds
#   * rate limiting lives in Fumox itself ([admin].rate_limit per IP); nginx
#     adds none on purpose: it would key on this container's view of the
#     client, the same address unless X-Forwarded-For is honored, and Fumox
#     does not read that header
#   * client_max_body_size covers the largest source import / pipeline JSON
#     the admin panel submits

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The access log must never carry the export tokens: a subscription link
    # is a bearer credential shared with proxy clients, and the stock
    # combined format logs the raw $request line (method + URI + args).
    # The map masks the token segment of the two export endpoints; $request
    # and $request_uri (the raw, args-carrying forms) are never logged.
    # error_log cannot be formatted (its lines embed the raw request
    # verbatim), so the token-bearing locations raise their error_log level
    # to crit, see the location / block in the template
    map $uri $fumox_safe_uri {
        ~^/export/alive/  "/export/alive/<masked>";
        ~^/export/ready/  "/export/ready/<masked>";
        default           $uri;
    }

    # Same fields as combined, $request replaced by method + masked URI +
    # protocol (the log_format directive must live in the http block, the
    # server blocks inherit this one)
    log_format  fumox  '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $fumox_safe_uri $server_protocol" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

    access_log  /var/log/nginx/access.log  fumox;

    sendfile      on;
    keepalive_timeout  65s;

    # The admin panel can POST imports and pipeline JSON, the nginx default
    # of 1 MB would reject them
    client_max_body_size 8m;

    # Subscription responses are small (a few hundred KB at most) and
    # fetched periodically by proxy clients; gzip would save bandwidth but
    # adds a dependency on the client supporting it
    # gzip on;

    # The resolver for the upstream names: Docker's embedded DNS
    # (127.0.0.11) resolves the compose service names. Variables in
    # proxy_pass defer name resolution to request time, so nginx starts even
    # when the `server` container is not up yet (compose startup race) and
    # re-resolves after its restarts. ipv6=off keeps resolution from waiting
    # on AAAA records the embedded DNS answers slowly for
    # The podman flavour ships an empty file: there the upstream is a
    # loopback address, which needs no resolver at all
    include /etc/nginx/resolver.conf;

    include /etc/nginx/conf.d/*.conf;
}
