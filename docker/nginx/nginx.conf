# Fumox TLS front, example configuration.
#
# Terminates HTTPS for both Fumox listeners:
#   /sub, /src, /export, /healthz → the public listener
#   /admin                          → the admin panel
#
# The server blocks live in templates/default.conf.template and are
# rendered by the nginx image's entrypoint into /etc/nginx/conf.d/. The
# upstream addresses are runtime variables, so the same image serves
# every deployment variant:
#
#   FUMOX_UPSTREAM_PUBLIC   the public listener (default server:8080)
#   FUMOX_UPSTREAM_ADMIN    the admin panel     (default server:8081)
#   FUMOX_SERVER_NAME       the canonical name of the deployment
#                           (default fumox.example.com)
#
# Two flavours, selected at build time (ARG NGINX_FLAVOUR):
#
#   compose  the upstreams are the compose service names, resolved
#            through Docker's embedded DNS (127.0.0.11). This is the
#            default and the only flavour that needs a resolver.
#   podman   run this nginx INSIDE the server pod (see docker/README.md,
#            "HTTPS for quadlet/kube"), then the server is on the pod
#            loopback and the upstreams are
#            FUMOX_UPSTREAM_PUBLIC=127.0.0.1:8080
#            FUMOX_UPSTREAM_ADMIN=127.0.0.1:8081
#            A loopback upstream needs no resolver, the podman flavour
#            therefore ships an empty resolver.conf.
#
# Bring-up:
#   1. certs: ./docker/nginx/certs/fullchain.pem + privkey.pem
#      (Let's Encrypt layout, see the Dockerfile header);
#   2. set FUMOX_SERVER_NAME to your domain (or "_" for a bare IP);
#   3. in the Fumox config set `[admin].secure_cookies = true`
#      (FUMOX_ADMIN__SECURE_COOKIES=true in .env), behind this front the
#      panel is only reachable via HTTPS, and the `Secure` cookie flag
#      makes browsers keep the session cookie on TLS-only connections;
#   4. the Host header is normalised before it is forwarded (see the
#      $fumox_host map in the template): the default ports are dropped,
#      a non-default port is kept, and a Host that is not a plain
#      hostname is replaced by the canonical name. Which names are
#      accepted at all is decided by Fumox itself:
#      [server].allowed_hosts (FUMOX_SERVER__ALLOWED_HOSTS).
#
# Notes on Fumox behavior worth knowing when tuning this file:
#   * the admin panel opens an SSE stream at /admin/events, it has its
#     own location with buffering off and a long read timeout, the
#     remaining /admin locations answer in seconds;
#   * rate limiting lives in Fumox itself ([admin].rate_limit per IP);
#     nginx adds none on purpose, it would key on this container's view
#     of the client, which is the same address unless X-Forwarded-For is
#     honored, and Fumox does not read that header. All throttling stays
#     where the limits are configured;
#   * client_max_body_size covers the largest source import / pipeline
#     JSON the admin panel submits.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;

    sendfile      on;
    keepalive_timeout  65s;

    # The admin panel can POST imports and pipeline JSON, the nginx
    # default of 1 MB would reject them.
    client_max_body_size 8m;

    # Subscription responses are small (a few hundred KB at most) and
    # fetched periodically by proxy clients; gzip would save bandwidth
    # but adds a dependency on the client supporting it, keep it simple.
    # gzip on;

    # The resolver for the upstream names. Docker's embedded DNS
    # (127.0.0.11) resolves the compose service names. Using variables
    # in proxy_pass defers name resolution to request time, so nginx
    # starts even when the `server` container is not up yet (compose
    # startup race) and re-resolves after its restarts. ipv6=off keeps
    # resolution from waiting on AAAA records the embedded DNS answers
    # slowly for.
    #
    # The podman flavour ships an empty file: there the upstream is a
    # loopback address, which needs no resolver at all.
    include /etc/nginx/resolver.conf;

    # The rendered server blocks (templates/default.conf.template).
    include /etc/nginx/conf.d/*.conf;
}
