# Fumox TLS front — example configuration.
#
# Terminates HTTPS for both Fumox listeners behind the `server` compose
# service:
#   /sub, /src, /export, /healthz → the public listener (server:8080)
#   /admin                          → the admin panel     (server:8081)
#
# Bring-up:
#   1. certs: ./docker/nginx/certs/fullchain.pem + privkey.pem
#      (Let's Encrypt layout — see the Dockerfile header);
#   2. replace server_name with your domain (or drop it for a bare IP);
#   3. in the Fumox config set `[admin].secure_cookies = true`
#      (FUMOX_ADMIN__SECURE_COOKIES=true in .env) — behind this front the
#      panel is only reachable via HTTPS, and the `Secure` cookie flag
#      makes browsers keep the session cookie on TLS-only connections;
#   4. the Host header is passed through untouched: the admin panel builds
#      its serve links from it, so keep `proxy_set_header Host $host`.
#
# Notes on Fumox behavior worth knowing when tuning this file:
#   * the admin panel opens an SSE stream at /admin/events — the
#     `proxy_buffering off` + long `proxy_read_timeout` below keep it live;
#   * rate limiting lives in Fumox itself ([admin].rate_limit per IP);
#     nginx adds none on purpose — it would key on this container's view
#     of the client, which is the same address unless X-Forwarded-For is
#     honored, and Fumox does not read that header. All throttling stays
#     where the limits are configured;
#   * client_max_body_size covers the largest source import / pipeline
#     JSON the admin panel submits.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;

    sendfile      on;
    keepalive_timeout  65s;

    # The admin panel can POST imports and pipeline JSON — the nginx
    # default of 1 MB would reject them.
    client_max_body_size 8m;

    # Subscription responses are small (a few hundred KB at most) and
    # fetched periodically by proxy clients; gzip would save bandwidth
    # but adds a dependency on the client supporting it — keep it simple.
    # gzip on;

    # Docker's embedded DNS (127.0.0.11) resolves the compose service
    # names. Using variables in proxy_pass defers name resolution to
    # request time, so nginx starts even when the `server` container is
    # not up yet (compose startup race) and re-resolves after its
    # restarts. ipv6=off keeps resolution from waiting on AAAA records
    # the embedded DNS answers slowly for.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ACME challenges + HTTPS redirect.
    server {
        listen 80;
        server_name _;

        # Relative Location: the browser keeps the scheme/host/port it
        # connected on (a NAT'd port mapping or the smoke stand's shifted
        # port survives; production 443 needs nothing extra).
        absolute_redirect off;

        # certbot writes its challenge files here (webroot mode).
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            # $http_host carries the port the client connected on; $host
            # would drop it (nginx normalizes :80 away), breaking
            # non-443 TLS mappings.
            return 301 https://$http_host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name fumox.example.com;   # ← your domain, or remove for a bare IP

        # Mounted at runtime (see the Dockerfile header); reload with
        # `docker kill -s HUP <nginx-container>` after renewal.
        ssl_certificate     /certs/fullchain.pem;
        ssl_certificate_key /certs/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;

        # Same rationale as on the :80 server: the admin panel may sit
        # behind a port mapping, keep the browser on its own port.
        absolute_redirect off;

        # ---- admin panel (server:8081) ---------------------------------
        # Everything /admin — the panel, its static assets, the SSE stream.
        location /admin {
            set $fumox_admin http://server:8081;
            proxy_pass $fumox_admin;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # /admin/events is a live SSE stream: buffering would delay
            # every dashboard update to the proxy buffer timeout.
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ---- public subscriptions (server:8080) -------------------------
        # /sub/{id}, /src/{slug}, /export/alive/{token} and /healthz.
        location / {
            set $fumox_public http://server:8080;
            proxy_pass $fumox_public;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # A client stuck on a slow proxy link must not hold a worker
            # forever; Fumox answers subscriptions from cache, fast.
            proxy_read_timeout 120s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
