# The resolver for the upstream names, compose flavour.
#
# Docker's embedded DNS (127.0.0.11) resolves the compose service
# names ("server"). The upstream names are used in a variable, so the
# resolution happens per request: nginx starts before the server
# container registers its name and survives its restarts. ipv6=off
# keeps the resolution from waiting on AAAA records the embedded DNS
# answers slowly for.
resolver 127.0.0.11 valid=10s ipv6=off;
