# The resolver for the upstream names, podman flavour: none.
#
# This nginx runs inside the server pod, so the upstream is the loopback
# address (FUMOX_UPSTREAM_PUBLIC=127.0.0.1:8080,
# FUMOX_UPSTREAM_ADMIN=127.0.0.1:8081). A literal address is not
# resolved, so no resolver is needed and the file stays empty.
